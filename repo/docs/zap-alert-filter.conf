# OWASP ZAP alert-filter config for the Crypto Dashboard API scans.
#
# Passed to the packaged scans via:  -c zap-alert-filter.conf
# Format (tab-separated):  <ruleId><TAB><ACTION><TAB><optional note>
# ACTION is one of: IGNORE | INFO | WARN | FAIL | OUTOFSCOPE
# Lines beginning with '#' are comments.
#
# Each entry below is a CONFIRMED false positive for a JSON REST API,
# triaged in docs/security-scan-2026-05-18.md. Tuning the scanner (not
# mutilating legitimate API payload) is the correct remediation for a
# confirmed false positive.
#
# 10096 — Timestamp Disclosure (Unix): ZAP flags any 10-digit integer
#   that resembles a Unix epoch. Every hit is a legitimate, functional
#   JSON field (createdAt / updatedAt, market-data timestamps and
#   ATH/ATL epoch dates returned by CoinGecko, etc.). These cannot be
#   removed without breaking the API contract and disclose nothing
#   sensitive. Accepted as a false positive -> IGNORE.
10096	IGNORE	Unix timestamps are legitimate JSON API fields (createdAt, market epochs) - confirmed false positive
